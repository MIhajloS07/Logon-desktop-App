<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Logon APP banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0f1b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="280" rx="14"/></clipPath>
  </defs>

  <style>
    .m { font-family: 'JetBrains Mono','Cascadia Code','Consolas','Courier New',monospace; }
    .scan { animation: scan 6s linear infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .dash { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    .l1 { animation: l1 9s infinite; }
    .l2 { animation: l2 9s infinite; }
    .l3 { animation: l3 9s infinite; }
    .l4 { animation: l4 9s infinite; }
    @keyframes scan  { from { transform: translateX(-320px); } to { transform: translateX(1500px); } }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes dash  { to { stroke-dashoffset: -28; } }
    @keyframes l1 { 0%,6%  { opacity: 0; } 10%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes l2 { 0%,20% { opacity: 0; } 24%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes l3 { 0%,34% { opacity: 0; } 38%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes l4 { 0%,48% { opacity: 0; } 52%,92% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)" opacity="0.55"/>
    <rect class="scan" x="0" y="0" width="320" height="280" fill="url(#scan)"/>

    <!-- left: title block -->
    <rect x="56" y="64" width="4" height="116" fill="url(#accent)"/>
    <text class="m" x="80" y="104" font-size="54" font-weight="700" fill="#e6edf7" letter-spacing="2">LOGON APP</text>
    <text class="m" x="82" y="140" font-size="17" fill="#8fa3c4">Desktop dashboard · Authentication · Notes · Weather telemetry</text>
    <text class="m" x="82" y="172" font-size="14" fill="#5f7396">C# · .NET 8 · WinForms · SQL Server · ADO.NET</text>
    <text class="m" x="82" y="228" font-size="15" fill="#22d3ee">$ dotnet run</text>
    <rect class="cursor" x="186" y="214" width="9" height="17" fill="#22d3ee"/>

    <!-- right: status terminal -->
    <rect x="760" y="40" width="384" height="200" rx="10" fill="#0a0f1d" stroke="#223156"/>
    <circle cx="782" cy="62" r="5" fill="#ef4444"/>
    <circle cx="800" cy="62" r="5" fill="#f59e0b"/>
    <circle cx="818" cy="62" r="5" fill="#22c55e"/>
    <line x1="760" y1="80" x2="1144" y2="80" stroke="#223156"/>

    <g class="m" font-size="14">
      <g class="l1"><text x="784" y="114" fill="#8fa3c4">auth.sha256 ........</text><text x="1000" y="114" fill="#22c55e">READY</text></g>
      <g class="l2"><text x="784" y="148" fill="#8fa3c4">sql.connection .....</text><text x="1000" y="148" fill="#22c55e">OPEN</text></g>
      <g class="l3"><text x="784" y="182" fill="#8fa3c4">weather.api ........</text><text x="1000" y="182" fill="#22c55e">200 OK</text></g>
      <g class="l4"><text x="784" y="216" fill="#8fa3c4">ui.theme ...........</text><text x="1000" y="216" fill="#22d3ee">DARK</text></g>
    </g>

    <!-- bottom accent line -->
    <line class="dash" x1="0" y1="276" x2="1200" y2="276" stroke="url(#accent)" stroke-width="3"/>
  </g>
</svg>
